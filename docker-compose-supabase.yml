# Simple Supabase setup attempt
# Docker Compose for local Supabase

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: supabase-postgres
    ports:
      - "54322:5432" # Changed port to avoid conflicts
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase-schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgREST for REST API
  rest:
    image: postgrest/postgrest:latest
    container_name: supabase-rest
    ports:
      - "3000:3000"
    environment:
      - PGRST_DB_URI=postgres://postgres:postgres@postgres:5432/postgres
      - PGRST_DB_ROLE=anon
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=super_secret_jwt_token
    depends_on:
      postgres:
        condition: service_healthy

  # Supabase Studio (Admin interface)
  studio:
    image: supabase/studio:latest
    container_name: supabase-studio
    ports:
      - "8000:3000"
    environment:
      - SUPABASE_URL=http://rest:3000
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    depends_on:
      - rest

volumes:
  postgres_data: